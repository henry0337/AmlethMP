<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — AmlethMP</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* ---------- Login screen ---------- */

    body {
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, var(--color-accent-glow), transparent 70%),
        var(--color-bg);
      background-attachment: fixed;
    }

    .login {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-height: 100vh;
      min-height: 100dvh;
    }

    .login__art {
      display: none;
    }

    .login__panel {
      display: flex;
      justify-content: center;
      padding: var(--space-6) var(--space-5) var(--space-5);
    }

    .login__content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-6);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login__intro {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      margin-block: auto;
    }

    .login__title {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      line-height: var(--line-height-tight);
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .login__subtitle {
      color: var(--color-text-muted);
    }

    .login__actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .login__divider {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      color: var(--color-text-subtle);
      font-size: var(--font-size-sm);
    }

    .login__divider::before,
    .login__divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .login__hint {
      color: var(--color-text-subtle);
      font-size: var(--font-size-sm);
    }

    .login__legal {
      color: var(--color-text-subtle);
      font-size: var(--font-size-xs);
    }

    .login__legal a {
      color: var(--color-text-muted);
    }

    /* States: set with ?state=loading | error (see script.js) */
    .login__error,
    .label--loading {
      display: none;
    }

    html[data-state="error"] .login__error {
      display: block;
    }

    html[data-state="loading"] .label--idle,
    html[data-state="loading"] .login__google .btn__icon {
      display: none;
    }

    html[data-state="loading"] .label--loading {
      display: inline;
    }

    html[data-state="loading"] .login__google .btn__spinner {
      display: block;
    }

    html[data-state="loading"] .login__google,
    html[data-state="loading"] .login__guest {
      pointer-events: none;
    }

    html[data-state="loading"] .login__guest {
      opacity: 0.55;
    }

    /* ---------- Tablet: centered card ---------- */
    @media (min-width: 768px) {
      .login__panel {
        align-items: center;
        padding: var(--space-7);
      }

      .login__content {
        justify-content: flex-start;
        gap: var(--space-6);
        max-width: 460px;
        padding: var(--space-7) var(--space-6);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: var(--color-surface);
      }

      .login__intro {
        margin-block: 0;
      }

      .login__title {
        font-size: var(--font-size-3xl);
      }

      .login .brand {
        align-self: center;
      }
    }

    /* ---------- Desktop: split layout ---------- */
    @media (min-width: 1280px) {
      .login {
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      }

      .login__art {
        position: relative;
        display: block;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(to right, #000 55%, transparent 100%);
        mask-image: linear-gradient(to right, #000 55%, transparent 100%);
      }

      .art__grid {
        position: absolute;
        inset: -25% -10%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--space-5);
        transform: rotate(-12deg);
      }

      .art__tile {
        aspect-ratio: 1;
        border-radius: var(--radius-lg);
        opacity: 0.85;
      }

      .art__tile:nth-child(6n + 1) { background: var(--cover-1); }
      .art__tile:nth-child(6n + 2) { background: var(--cover-2); }
      .art__tile:nth-child(6n + 3) { background: var(--cover-3); }
      .art__tile:nth-child(6n + 4) { background: var(--cover-4); }
      .art__tile:nth-child(6n + 5) { background: var(--cover-5); }
      .art__tile:nth-child(6n) { background: var(--cover-6); }

      .login__panel {
        align-items: center;
        padding: var(--space-7);
      }

      .login__content {
        justify-content: flex-start;
        max-width: 400px;
        padding: 0;
        border: 0;
        background: none;
        text-align: left;
        gap: var(--space-6);
      }

      .login__intro {
        margin-block: 0;
      }

      .login__title {
        font-size: var(--font-size-3xl);
      }

      .login .brand {
        align-self: flex-start;
      }

      .login__hint {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="login">
    <section class="login__art" aria-hidden="true">
      <div class="art__grid">
        <span class="art__tile"></span><span class="art__tile"></span><span class="art__tile"></span><span class="art__tile"></span>
        <span class="art__tile"></span><span class="art__tile"></span><span class="art__tile"></span><span class="art__tile"></span>
        <span class="art__tile"></span><span class="art__tile"></span><span class="art__tile"></span><span class="art__tile"></span>
        <span class="art__tile"></span><span class="art__tile"></span><span class="art__tile"></span><span class="art__tile"></span>
      </div>
    </section>

    <section class="login__panel">
      <div class="login__content">
        <div class="brand">
          <svg class="brand__mark" viewBox="0 0 36 36" aria-hidden="true">
            <defs>
              <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" style="stop-color: var(--color-accent)"/>
                <stop offset="1" style="stop-color: #5b3fd0"/>
              </linearGradient>
            </defs>
            <rect width="36" height="36" rx="10" fill="url(#brand-gradient)"/>
            <rect x="9" y="15" width="4" height="10" rx="2" fill="#fff"/>
            <rect x="16" y="9" width="4" height="18" rx="2" fill="#fff"/>
            <rect x="23" y="13" width="4" height="12" rx="2" fill="#fff"/>
          </svg>
          <span>AmlethMP</span>
        </div>

        <div class="login__intro">
          <h1 class="login__title">Music that moves with you.</h1>
          <p class="login__subtitle">Sign in to sync your library and playlists on every device.</p>
        </div>

        <div class="login__actions">
          <p class="alert login__error" role="alert">Couldn't sign in with Google. Check your connection and try again.</p>

          <button class="btn btn--primary login__google" type="button">
            <svg class="btn__icon" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span class="btn__spinner" aria-hidden="true"></span>
            <span class="label--idle">Continue with Google</span>
            <span class="label--loading">Signing in…</span>
          </button>

          <div class="login__divider" aria-hidden="true">or</div>

          <button class="btn btn--secondary login__guest" type="button">Continue as guest</button>
          <p class="login__hint">Guest sessions don't save your library.</p>
        </div>

        <p class="login__legal">
          By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </p>
      </div>
    </section>
  </main>

  <script src="../script.js"></script>
</body>
</html>
