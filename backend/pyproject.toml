[project]
name = "backend"
version = "0.1.0"
description = "AmlethMP backend API"
readme = "README.md"
requires-python = "==3.14.10"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi[standard]==0.162.0",
    "pydantic-settings>=2.7,<3.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "sqlalchemy>=2.0,<2.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
