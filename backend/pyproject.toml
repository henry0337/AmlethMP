[project]
name = "backend"
version = "0.1.0"
description = "AmlethMP backend API"
readme = "README.md"
requires-python = "==3.12.3"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi[standard]==0.162.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<2.1",
]

[tool.fastapi]
entrypoint = "app.main:app"
