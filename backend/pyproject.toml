[project]
name = "backend"
version = "0.1.0"
description = "AmlethMP backend API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.32,<0.33",
    "fastapi[standard]==0.162.0",
    "httpx>=0.28,<0.29",
    "itsdangerous>=2.2,<3.0",
    "pydantic>=2.14,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest>=9.2,<10.0",
    "ruff==0.17.6",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
# Ignore existing trailing commas so layout depends only on line length. `scripts/format.py`
# removes the trailing commas that Ruff still adds when it puts one element per line.
skip-magic-trailing-comma = true

[tool.ruff.lint]
# Import sorting (`I`) is not selected here: `ruff check` would require trailing commas in wrapped
# imports. `scripts/format.py` sorts imports instead.
select = [
    "E",
    "F",
    "W",
    "UP",
    "B",
    "ASYNC",
    "S",
    "FAST",
    "T20",
    "DTZ",
    "PT",
    "SIM",
    "C4",
    "RUF",
]

[tool.ruff.lint.isort]
# `alembic/` is the migration folder, so Ruff would treat the package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain `assert` statements and fake credentials.
"tests/**" = ["S101", "S105", "S106"]
# Command-line scripts print their results.
"scripts/**" = ["T201"]

[tool.pyright]
include = ["app", "tests", "alembic", "scripts"]
# Strict checking applies to application code. Migrations, helper scripts and other files the
# project owner names as exceptions are excluded; add them to this list.
exclude = ["**/__pycache__", ".venv", "alembic/versions", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
